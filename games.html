<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1>Список игр</h1>
<ul>
    {% for game in games %}
        <li>
            {{ game.title }} -
            {{ game.genre }} -
            {{ game.release_year }}
        </li>
    {% empty %}
        <li>Список игр пуст</li>
    {% endfor %}
</ul>
</body>
</html>
